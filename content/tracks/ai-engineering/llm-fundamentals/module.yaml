id: llm-fundamentals
track: ai-engineering
order: 1
title: LLM fundamentals for engineers
summary: Tokens, context windows, cost, latency and prompt caching, and how to pack a context window on a budget.
level: intro
minutes: 50
prerequisites: []
objectives:
  - Estimate tokens, cost and latency for a request before sending it.
  - Explain what prompt caching needs (a stable prefix) and how to order a prompt to get it.
  - Decide what goes into a context window when it doesn't all fit, and defend the order.
