id: agent-loop
track: ai-engineering
order: 3
title: The agent loop
summary: Build the loop at the heart of every agent - model calls tools, tools return results, repeat - with parallel tools, errors and limits handled.
level: intermediate
minutes: 60
prerequisites: [structured-output]
objectives:
  - Implement a tool-use loop with the message shapes real APIs use (tool_use and tool_result blocks).
  - Run independent tool calls in parallel and return all results in one message.
  - Report tool failures to the model as errors it can recover from, instead of crashing.
  - Bound an agent with turn limits and explain when a workflow beats an agent.
skills:
