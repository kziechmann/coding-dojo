id: sliding-window
track: dsa
order: 3
title: Sliding window
summary: Solve contiguous-subarray and substring problems in one pass by growing and shrinking a window instead of re-scanning.
level: intermediate
minutes: 50
prerequisites: [arrays-hashing]
objectives:
  - Recognize fixed-size and variable-size window problems.
  - Maintain window state (a sum, counts, last-seen positions) in O(1) per step.
  - State the invariant that tells you when to shrink, and prove the O(n) bound.
skills:
  - id: dsa.sliding-window
    title: Sliding window
    interview_weight: 0.9
exercises:
