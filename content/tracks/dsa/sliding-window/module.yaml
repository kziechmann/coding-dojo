    title: Maximum sum of k consecutive numbers
    kind: code
    difficulty: easy
    minutes: 15
    skills: [dsa.sliding-window]
  - id: longest-unique-substring
    title: Longest substring without repeating characters
    kind: code
    difficulty: medium
    minutes: 25
    skills: [dsa.sliding-window]
